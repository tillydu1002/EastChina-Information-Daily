<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0052D9">
<title>华东区域政策日报 · 2026年5月11日—5月12日</title>
<style>
  :root {
    --brand-1: #F2F6FF;
    --brand-2: #E0EAFF;
    --brand-5: #366EF4;
    --brand-6: #0052D9;
    --brand-7: #0034B5;
    --brand-8: #001F73;
    --ink-0:   #0B1426;
    --ink-1:   #1F2937;
    --ink-2:   #3A4458;
    --ink-3:   #6B7280;
    --ink-4:   #9CA3AF;
    --ink-5:   #C7CCD3;
    --line:    #ECEEF2;
    --line-2:  #F2F4F7;
    --bg:      #F4F6FA;
    --surface: #FFFFFF;
    --danger:  #E5341C;
    --warn:    #F08200;
    --ok:      #11874E;
    --shadow-1: 0 1px 2px rgba(15,30,80,0.04), 0 1px 8px rgba(15,30,80,0.04);
    --shadow-2: 0 6px 24px -8px rgba(0,82,217,0.18);
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink-1);
    font-size: 14.5px; line-height: 1.65; overflow: hidden;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "tnum" on, "ss01" on;
  }
  a { color: var(--brand-6); text-decoration: none; }

  .header {
    position: fixed; top: 0; left: 0; right: 0; height: 96px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    color: var(--ink-0);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line);
    z-index: 100; padding: 6px 16px;
  }
  .header .title {
    font-size: 16.5px; font-weight: 600; letter-spacing: 0.2px;
    color: var(--ink-0);
  }
  .header .title::before {
    content: ""; display: inline-block;
    width: 4px; height: 14px; background: var(--brand-6);
    border-radius: 2px; margin-right: 8px; vertical-align: -1px;
  }
  .header .sub {
    font-size: 11px; color: var(--ink-3); margin-top: 4px;
    letter-spacing: 0.3px;
  }
  .header .date-picker {
    margin-top: 8px; display: inline-flex; align-items: center;
    background: var(--brand-1);
    border: 1px solid var(--brand-2);
    color: var(--brand-7);
    border-radius: var(--r-pill); padding: 3px 12px; font-size: 12px;
    font-weight: 500; cursor: pointer; user-select: none;
    transition: all 0.2s ease;
  }
  .date-picker:active { background: var(--brand-2); }
  .date-picker .arrow { margin-left: 6px; font-size: 9px; opacity: 0.7; }

  .date-modal {
    position: fixed; inset: 0; background: rgba(11,20,38,0.42);
    z-index: 300; display: none;
    align-items: flex-end; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .date-modal.show { display: flex; }
  .date-modal .sheet {
    width: 100%; max-width: 480px;
    background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 12px 12px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: slideUp 0.24s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  .date-modal .sheet .ttl {
    font-size: 14px; font-weight: 600; color: var(--ink-0);
    text-align: center; padding: 10px 0 12px;
    border-bottom: 1px solid var(--line-2);
  }
  .date-modal .sheet .opt {
    padding: 13px 14px; font-size: 14px; color: var(--ink-1);
    border-bottom: 1px solid var(--line-2);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .date-modal .sheet .opt:last-of-type { border-bottom: 0; }
  .date-modal .sheet .opt:active { background: var(--brand-1); }
  .date-modal .sheet .opt.cur { color: var(--brand-6); font-weight: 600; }
  .date-modal .sheet .opt.cur::after { content: "✓"; color: var(--brand-6); font-weight: 700; }
  .date-modal .sheet .opt .sub { font-size: 11px; color: var(--ink-4); margin-left: 8px; font-weight: normal; }
  .date-modal .sheet .cancel {
    margin-top: 10px; padding: 13px; text-align: center;
    background: var(--bg); border-radius: var(--r-md);
    font-size: 14px; color: var(--ink-2); cursor: pointer;
    font-weight: 500;
  }

  .content {
    position: fixed; top: 96px; left: 0; right: 0;
    bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px 14px 24px;
  }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.28s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }

  .section-title {
    display: flex; align-items: center; margin: 18px 2px 12px;
    font-size: 15.5px; font-weight: 600; color: var(--ink-0);
    letter-spacing: 0.2px;
  }
  .section-title:first-child { margin-top: 4px; }
  .section-title::before {
    content: ""; width: 3px; height: 16px;
    background: var(--brand-6);
    margin-right: 9px; border-radius: 2px;
  }
  .section-count {
    margin-left: 10px; font-size: 11px; font-weight: 600;
    color: var(--brand-6);
    background: var(--brand-1);
    padding: 1px 9px; border-radius: var(--r-pill);
    font-feature-settings: "tnum" on;
  }
  .sub-title {
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    margin: 14px 2px 8px;
    padding: 3px 10px;
    background: var(--line-2);
    border-radius: var(--r-sm);
    display: inline-block;
    letter-spacing: 0.2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 14px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-1);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:active { transform: translateY(1px); }
  .card .meta {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin-bottom: 9px;
  }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: var(--r-sm);
    font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
    font-feature-settings: "tnum" on;
  }
  .tag-date    { background: var(--brand-1); color: var(--brand-7); }
  .tag-region  { background: var(--brand-1); color: var(--brand-6); }
  .tag-cat     { background: #ECF7F1; color: #11874E; }
  .tag-impact-h { background: #FDECE9; color: var(--danger); }
  .tag-impact-m { background: #FEF3E0; color: #B36100; }
  .tag-impact-l { background: var(--brand-1); color: var(--brand-6); }

  .card .title-line {
    font-size: 14.5px; font-weight: 600; color: var(--ink-0);
    line-height: 1.55; margin-bottom: 8px;
    letter-spacing: 0.1px;
  }
  .card .interp {
    font-size: 13px; color: var(--ink-2); line-height: 1.72;
    background: var(--brand-1);
    border-left: 3px solid var(--brand-6);
    padding: 9px 12px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
    margin-bottom: 9px;
  }
  .card .source {
    font-size: 12px; color: var(--ink-3);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 4px;
    padding-top: 4px;
  }
  .card .source a { color: var(--brand-6); font-weight: 500; }

  .focus-item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ink-5);
    border-radius: var(--r-md);
    padding: 13px 14px;
    margin-bottom: 9px;
    box-shadow: var(--shadow-1);
  }
  .focus-item.urgent { border-left-color: var(--danger); }
  .focus-item.important { border-left-color: var(--brand-6); }
  .focus-item .head {
    font-size: 14px; font-weight: 600; line-height: 1.55;
    color: var(--ink-0); margin-bottom: 6px;
    letter-spacing: 0.1px;
  }
  .focus-item.urgent .head::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    background: var(--danger); border-radius: 50%;
    margin-right: 6px; vertical-align: 3px;
  }
  .focus-item.important .head::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    background: var(--brand-6); border-radius: 50%;
    margin-right: 6px; vertical-align: 3px;
  }
  .focus-item .action {
    font-size: 12.5px; color: var(--ink-2); line-height: 1.7;
    padding-left: 12px;
    border-left: 2px solid var(--line);
    margin-left: 1px;
  }

  .alert-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 13px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-1);
    display: flex; gap: 12px; align-items: stretch;
  }
  .alert-card .lv-pill { flex: 0 0 auto; width: 4px; align-self: stretch; border-radius: 2px; }
  .alert-card.lv1 .lv-pill { background: var(--danger); }
  .alert-card.lv2 .lv-pill { background: var(--warn); }
  .alert-card.lv3 .lv-pill { background: var(--brand-6); }
  .alert-card .body { flex: 1; min-width: 0; }
  .alert-card .head-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .alert-card .lv-tag {
    font-size: 10.5px; font-weight: 700;
    padding: 2px 8px; border-radius: var(--r-pill);
    letter-spacing: 0.3px;
  }
  .alert-card.lv1 .lv-tag { background: #FDECE9; color: var(--danger); }
  .alert-card.lv2 .lv-tag { background: #FEF3E0; color: #B36100; }
  .alert-card.lv3 .lv-tag { background: var(--brand-1); color: var(--brand-6); }
  .alert-card .countdown {
    font-size: 12px; font-weight: 600;
    font-feature-settings: "tnum" on;
  }
  .alert-card.lv1 .countdown { color: var(--danger); }
  .alert-card.lv2 .countdown { color: #B36100; }
  .alert-card.lv3 .countdown { color: var(--brand-6); }
  .alert-card .a-title {
    font-size: 14px; font-weight: 600; color: var(--ink-0);
    line-height: 1.55; margin-bottom: 5px;
  }
  .alert-card .a-detail {
    font-size: 12.5px; color: var(--ink-2);
    line-height: 1.7;
  }
  .alert-card .a-link {
    margin-top: 8px; font-size: 12px; font-weight: 500;
  }
  .alert-card .a-link a { color: var(--brand-6); }

  .digest-banner {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px 18px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-1);
    position: relative; overflow: hidden;
  }
  .digest-banner::before {
    content: ""; position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--brand-6), var(--brand-5));
  }
  .digest-banner::after {
    content: ""; position: absolute;
    top: -50px; right: -50px; width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(0,82,217,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .digest-banner .label {
    font-size: 10.5px; letter-spacing: 1.6px;
    color: var(--brand-6); font-weight: 600;
    text-transform: uppercase;
  }
  .digest-banner .date-big {
    font-size: 26px; font-weight: 700;
    color: var(--ink-0);
    margin: 6px 0 8px;
    letter-spacing: 0.5px;
    font-feature-settings: "tnum" on;
  }
  .digest-banner .summary {
    font-size: 13px; line-height: 1.75;
    color: var(--ink-2);
  }

  .stat-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 12px 4px;
    text-align: center;
    box-shadow: var(--shadow-1);
  }
  .stat-card .num {
    font-size: 22px; font-weight: 700;
    color: var(--brand-6);
    line-height: 1.1;
    font-feature-settings: "tnum" on;
    letter-spacing: -0.5px;
  }
  .stat-card .lbl {
    font-size: 10.5px; color: var(--ink-3);
    margin-top: 5px; letter-spacing: 0.3px;
  }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(56px + env(safe-area-inset-bottom, 0px));
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line);
    display: flex; overflow-x: auto;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 200;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 1 1 0;
    min-width: 0;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--ink-4); font-size: 10.5px; font-weight: 500;
    gap: 3px; padding: 0 2px;
    transition: color 0.18s ease;
    cursor: pointer; user-select: none;
    -webkit-user-select: none;
    background: transparent; border: 0; outline: 0;
    letter-spacing: 0.3px;
  }
  .tab-btn::before {
    content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 0; height: 2px; background: var(--brand-6);
    border-radius: 0 0 2px 2px; transition: width 0.22s cubic-bezier(.2,.8,.2,1);
  }
  .tab-btn:active { color: var(--brand-7); }
  .tab-btn.active { color: var(--brand-6); }
  .tab-btn.active::before { width: 22px; }
  .tab-btn .ic { font-size: 0; line-height: 0; pointer-events: none; }
  .tab-btn .ic svg {
    width: 21px; height: 21px;
    pointer-events: none; display: block;
    transition: transform 0.22s cubic-bezier(.2,.8,.2,1);
  }
  .tab-btn.active .ic svg { transform: scale(1.06); }

  .empty {
    text-align: center; padding: 36px 20px; color: var(--ink-4);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--r-md);
  }
  .empty .icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }
  .empty .text { font-size: 13px; line-height: 1.7; }
  .empty .text strong { color: var(--ink-2); }

  .meta-line {
    font-size: 12px; color: var(--ink-3);
    margin-bottom: 5px; line-height: 1.65;
  }
  .meta-line .k { color: var(--ink-2); font-weight: 500; }

  .impact-card { position: relative; padding-left: 18px; }
  .impact-card::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 3px; border-radius: 2px;
  }
  .impact-card.h::before { background: var(--danger); }
  .impact-card.m::before { background: var(--warn); }
  .impact-card.l::before { background: var(--brand-6); }

  .chip-bar {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 4px 2px 12px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 6px 14px; border-radius: var(--r-pill);
    font-size: 12.5px; color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer; user-select: none;
    transition: all 0.18s ease;
    font-weight: 500;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active {
    background: var(--brand-6); color: #fff;
    border-color: var(--brand-6);
    box-shadow: 0 2px 10px rgba(0,82,217,0.25);
  }

  .stat-grid-policy {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 10px;
  }
  .stat-card-mini {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 11px 4px;
    text-align: center;
    box-shadow: var(--shadow-1);
  }
  .stat-card-mini .num {
    font-size: 20px; font-weight: 700; line-height: 1.1;
    font-feature-settings: "tnum" on; letter-spacing: -0.4px;
  }
  .stat-card-mini.total .num { color: var(--brand-6); }
  .stat-card-mini.high .num  { color: var(--danger); }
  .stat-card-mini.mid .num   { color: var(--warn); }
  .stat-card-mini.low .num   { color: var(--brand-5); }
  .stat-card-mini .lbl {
    font-size: 10.5px; color: var(--ink-3);
    margin-top: 5px; letter-spacing: 0.3px;
  }

  .impact-group-title {
    display: flex; align-items: center; gap: 7px;
    margin: 16px 2px 9px; font-size: 13.5px; font-weight: 600;
    letter-spacing: 0.2px;
  }
  .impact-group-title .dot { width: 8px; height: 8px; border-radius: 50%; }
  .impact-group-title.h .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(229,52,28,0.12); }
  .impact-group-title.m .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(240,130,0,0.12); }
  .impact-group-title.l .dot { background: var(--brand-6); box-shadow: 0 0 0 3px rgba(0,82,217,0.12); }
  .impact-group-title .badge {
    margin-left: auto;
    font-size: 11px; color: var(--ink-3); font-weight: 500;
    background: var(--line-2);
    padding: 2px 9px; border-radius: var(--r-pill);
    font-feature-settings: "tnum" on;
  }

  .ev-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 13px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-1);
    display: flex; gap: 12px; align-items: stretch;
  }
  .ev-date {
    flex: 0 0 88px;
    background: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
    color: var(--brand-7);
    border-radius: var(--r-md);
    padding: 10px 6px; text-align: center;
    display: flex; flex-direction: column; justify-content: center;
    border: 1px solid var(--brand-2);
  }
  .ev-date .big {
    font-size: 13px; font-weight: 700; line-height: 1.3;
    color: var(--brand-8);
    font-feature-settings: "tnum" on;
  }
  .ev-date .city {
    margin-top: 5px; font-size: 11px;
    color: var(--brand-6); opacity: 0.92;
  }
  .ev-body { flex: 1; min-width: 0; }
  .ev-body .ev-name {
    font-size: 14px; font-weight: 600; color: var(--ink-0);
    line-height: 1.55; margin-bottom: 6px;
  }
  .ev-body .ev-meta {
    font-size: 12px; color: var(--ink-3);
    line-height: 1.6; margin-bottom: 4px;
  }
  .ev-body .ev-rel {
    font-size: 12px; color: var(--brand-6); font-weight: 500;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">华东区域政策日报</div>
  <div class="sub">江浙沪皖闽赣湘</div>
  <div class="date-picker" id="datePicker">
    <span id="datePickerText">5月12日 · 今日</span>
    <span class="arrow">▼</span>
  </div>
</div>

<div class="date-modal" id="dateModal">
  <div class="sheet">
    <div class="ttl">选择日期</div>
    <div class="opt" data-date="all">所有<span class="sub">5月11日—5月12日 全量</span></div>
    <div class="opt" data-date="2026-05-11">5月11日<span class="sub">周一</span></div>
    <div class="opt cur" data-date="2026-05-12">5月12日<span class="sub">今日 · 周二</span></div>
    <div class="cancel" id="dateCancel">取消</div>
  </div>
</div>

<div class="content" id="content">
  <div class="panel active" data-panel="digest"><div id="digest-body"></div></div>
  <div class="panel" data-panel="alert"><div id="alert-body"></div></div>
  <div class="panel" data-panel="policy"><div id="policy-body"></div></div>
  <div class="panel" data-panel="rs"><div id="rs-body"></div></div>
  <div class="panel" data-panel="tx"><div id="tx-body"></div></div>
  <div class="panel" data-panel="event"><div id="event-body"></div></div>
</div>

<div class="tabbar">
  <div class="tab-btn active" data-tab="digest" onclick="switchTab('digest')">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2 4 4 8-8 4 4"/><path d="M3 20h18"/></svg></span>
    导读

  } else if (isToday){

  }

  html += '<div class="section-title">本期说明</div>' +

function renderAlert(){
  const wrap = document.getElementById('alert-body');
  const items = ALERTS.filter(dateMatch);
  let html = '<div class="section-title">预警与监管<span class="section-count">' + items.length + '</span></div>';
  if (items.length === 0){
    html += '<div class="empty"><div class="text">该日无预警事项</div></div>';
    wrap.innerHTML = html;
    return;
  }
  const lvText = function(lv){ return lv === 1 ? '一级紧急' : (lv === 2 ? '二级重要' : '三级关注'); };
  items.forEach(function(a){
    html += '<div class="alert-card lv' + a.level + '">' +
      '<div class="lv-pill"></div>' +
      '<div class="body">' +
        '<div class="head-row">' +
          '<span class="lv-tag">' + lvText(a.level) + '</span>' +
          '<span class="countdown">⚠ ' + escapeHtml(a.countdown) + '</span>' +
        '</div>' +
        '<div class="a-title">' + escapeHtml(a.title) + '</div>' +
        '<div class="a-detail">' + escapeHtml(a.detail) + '</div>' +
        (a.url && a.url !== '#' ? '<div class="a-link"><a href="' + a.url + '" target="_blank">点击查看详情 ›</a></div>' : '') +
      '</div>' +
    '</div>';
  });
  wrap.innerHTML = html;
}

function renderPolicy(){
  const wrap = document.getElementById('policy-body');
  const dateItems = POLICY.filter(dateMatch);
  const items = CURRENT_REGION === '全部' ? dateItems : dateItems.filter(function(p){ return p.region === CURRENT_REGION; });

  const cntH = items.filter(function(p){ return p.impact === '高'; }).length;
  const cntM = items.filter(function(p){ return p.impact === '中'; }).length;
  const cntL = items.filter(function(p){ return p.impact === '低'; }).length;

  let html = '<div class="chip-bar" id="chipBar">';
  ALL_REGIONS.forEach(function(r){
    const cls = r === CURRENT_REGION ? 'chip active' : 'chip';
    html += '<div class="' + cls + '" data-region="' + r + '">' + r + '</div>';
  });
  html += '</div>';

  html += '<div class="stat-grid-policy">' +
    '<div class="stat-card-mini total"><div class="num">' + items.length + '</div><div class="lbl">总条目</div></div>' +
    '<div class="stat-card-mini high"><div class="num">' + cntH + '</div><div class="lbl">高影响</div></div>' +
    '<div class="stat-card-mini mid"><div class="num">' + cntM + '</div><div class="lbl">中影响</div></div>' +
    '<div class="stat-card-mini low"><div class="num">' + cntL + '</div><div class="lbl">低影响</div></div>' +
    '</div>';

  const groups = [
    {key: '高', cls: 'h', label: '高影响政策', list: items.filter(function(p){ return p.impact === '高'; })},
    {key: '中', cls: 'm', label: '中影响政策', list: items.filter(function(p){ return p.impact === '中'; })},
    {key: '低', cls: 'l', label: '低影响政策', list: items.filter(function(p){ return p.impact === '低'; })}
  ];

  if (items.length === 0){
    html += '<div class="empty"><div class="text">当前筛选条件下无政策条目</div></div>';
  } else {
    groups.forEach(function(g){
      if (g.list.length === 0) return;
      html += '<div class="impact-group-title ' + g.cls + '"><span class="dot"></span>' + g.label + '<span class="badge">' + g.list.length + '条</span></div>';
      g.list.forEach(function(p){
        html += '<div class="card impact-card ' + g.cls + '">' +
          '<div class="meta">' +
            '<span class="tag tag-date">' + fmtDate(p.date) + '</span>' +
            '<span class="tag tag-region">' + escapeHtml(p.region) + '</span>' +
            '<span class="tag tag-cat">' + escapeHtml(p.cat) + '</span>' +
            impactTag(p.impact) +
          '</div>' +
          '<div class="title-line">' + escapeHtml(p.title) + '</div>' +
          '<div class="meta-line"><span class="k">发布部门：</span>' + escapeHtml(p.dept) + '</div>' +
          '<div class="meta-line"><span class="k">影响研判：</span>' + escapeHtml(p.impactReason) + '</div>' +
          '<div class="interp">' + escapeHtml(p.summary) + '</div>' +
          '<div class="source">' +
            '<span>来源：' + escapeHtml(p.source) + '</span>' +
            '<a href="' + p.url + '" target="_blank">查看原文 ›</a>' +
          '</div>' +
        '</div>';
      });
    });
  }

  wrap.innerHTML = html;

  wrap.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){
      CURRENT_REGION = c.dataset.region;
      renderPolicy();
    });
  });
}

function renderAll(){
  renderDigest();
  renderAlert();
  renderPolicy();
  renderRs();
  renderTx();

}

(function bindDatePicker(){
  const picker = document.getElementById('datePicker');
  const modal = document.getElementById('dateModal');
  const cancel = document.getElementById('dateCancel');
  const text = document.getElementById('datePickerText');
  const opts = modal.querySelectorAll('.opt');

  function setActive(date){
    opts.forEach(function(o){
      o.classList.toggle('cur', o.dataset.date === date);
    });
  }

  function labelOf(date){
    if (date === 'all') return '所有 · 5月11日—5月12日';
    const d = date.split('-');
    const isToday = date === '2026-05-12';
    return parseInt(d[1]) + '月' + parseInt(d[2]) + '日 · ' + (isToday ? '今日' : '昨日');
  }

  picker.addEventListener('click', function(){
    setActive(CURRENT_DATE);
    modal.classList.add('show');
  });
  cancel.addEventListener('click', function(){ modal.classList.remove('show'); });
  modal.addEventListener('click', function(e){
    if (e.target === modal) modal.classList.remove('show');
  });
  opts.forEach(function(o){
    o.addEventListener('click', function(){
      CURRENT_DATE = o.dataset.date;
      text.textContent = labelOf(CURRENT_DATE);
      modal.classList.remove('show');
      renderAll();
    });
  });
})();

renderAll();

});
