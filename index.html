<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#1a3a6c" />
  <title>华东政策日报</title>
  <link rel="stylesheet" href="style.css?v=20260507b" />
</head>
<body>

  <!-- ===== 顶部头：标题 + 日期选择器 ===== -->
  <header class="app-header">
    <div class="app-header-row">
      <div class="app-title">
        <span class="app-title-main" id="reportTitle">华东政策日报</span>
        <span class="app-title-sub" id="reportSubtitle"></span>
      </div>
      <button class="date-trigger" id="dateTrigger" aria-label="选择日期">
        <span class="date-trigger-icon">📅</span>
        <span class="date-trigger-text" id="dateTriggerText">2026-05-07</span>
        <span class="date-trigger-arrow">▼</span>
      </button>
    </div>
  </header>

  <!-- ===== 日期选择弹层 ===== -->
  <div class="date-picker-mask" id="datePickerMask" hidden>
    <div class="date-picker">
      <div class="date-picker-header">
        <span>选择日期</span>
        <button class="date-picker-close" id="datePickerClose" aria-label="关闭">×</button>
      </div>
      <div class="date-picker-list" id="datePickerList">
        <!-- 由 JS 渲染日期项 -->
      </div>
    </div>
  </div>

  <!-- ===== 主内容区（每个 page 是一个 tab 的内容） ===== -->
  <main class="app-main" id="appMain">

    <section class="page" data-page="highlights" id="page-highlights">
      <div class="page-header">
        <h2>📌 本日重点关注</h2>
        <p class="page-desc">前 2 条紧急事项 · 后续为重要事项</p>
      </div>
      <div class="page-body" id="highlightsBody"></div>
    </section>

    <section class="page" data-page="alerts" id="page-alerts" hidden>
      <div class="page-header">
        <h2>⚠️ 预警提示</h2>
        <p class="page-desc">紧急（红） · 重要（蓝） · 关注（绿）</p>
      </div>
      <div class="page-body" id="alertsBody"></div>
    </section>

    <section class="page" data-page="entries" id="page-entries" hidden>
      <div class="page-header">
        <h2>📄 重点政策动态</h2>
        <p class="page-desc">国家级 · 上海 · 江苏 · 浙江 · 安徽 · 福建 · 湖南 · 江西</p>
      </div>
      <div class="page-body" id="entriesBody"></div>
    </section>

    <section class="page" data-page="personnel" id="page-personnel" hidden>
      <div class="page-header">
        <h2>👤 人事变动</h2>
        <p class="page-desc">副部级及以上含四维分析卡片</p>
      </div>
      <div class="page-body" id="personnelBody"></div>
    </section>

    <section class="page" data-page="tencent" id="page-tencent" hidden>
      <div class="page-header">
        <h2>🐧 腾讯公司动态</h2>
        <p class="page-desc">腾讯最新业务、技术、生态进展</p>
      </div>
      <div class="page-body" id="tencentBody"></div>
    </section>

    <section class="page" data-page="competitors" id="page-competitors" hidden>
      <div class="page-header">
        <h2>🏢 友商动态</h2>
        <p class="page-desc">国外在前 · 国内在后</p>
      </div>
      <div class="page-body" id="competitorsBody"></div>
    </section>

    <section class="page" data-page="events" id="page-events" hidden>
      <div class="page-header">
        <h2>📅 区域重要活动</h2>
        <p class="page-desc">关联度评级：⭐⭐⭐ 高 / ⭐⭐ 中 / ⭐ 低</p>
      </div>
      <div class="page-body" id="eventsBody"></div>
    </section>

  </main>

  <!-- ===== 底部固定 Tab Bar ===== -->
  <nav class="tab-bar" id="tabBar" role="tablist">
    <button class="tab-item active" data-tab="highlights" role="tab">
      <span class="tab-icon">📌</span>
      <span class="tab-label">重点</span>
    </button>
    <button class="tab-item" data-tab="alerts" role="tab">
      <span class="tab-icon">⚠️</span>
      <span class="tab-label">预警</span>
    </button>
    <button class="tab-item" data-tab="entries" role="tab">
      <span class="tab-icon">📄</span>
      <span class="tab-label">政策</span>
    </button>
    <button class="tab-item" data-tab="personnel" role="tab">
      <span class="tab-icon">👤</span>
      <span class="tab-label">人事</span>
    </button>
    <button class="tab-item" data-tab="tencent" role="tab">
      <span class="tab-icon">🐧</span>
      <span class="tab-label">腾讯</span>
    </button>
    <button class="tab-item" data-tab="competitors" role="tab">
      <span class="tab-icon">🏢</span>
      <span class="tab-label">友商</span>
    </button>
    <button class="tab-item" data-tab="events" role="tab">
      <span class="tab-icon">📅</span>
      <span class="tab-label">活动</span>
    </button>
  </nav>

  <script src="data.js?v=20260507b"></script>
  <script src="app.js?v=20260507b"></script>
</body>
</html>
