<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#1a3a6c" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>华东政策日报</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 顶部头：标题 + 日期选择器 ===== -->
  <header class="app-header">
    <div class="app-header-row">
      <div class="app-title">
        <span class="app-title-main" id="reportTitle">华东政策日报</span>
        <span class="app-title-sub" id="reportSubtitle"></span>
      </div>
      <button class="date-trigger" id="dateTrigger" type="button">
        <span class="date-trigger-icon">📅</span>
        <span class="date-trigger-text" id="dateTriggerText">2026-05-07</span>
        <span class="date-trigger-arrow">▼</span>
      </button>
    </div>
  </header>

  <!-- ===== 日期切换弹层 ===== -->
  <div class="date-picker-mask" id="datePickerMask" hidden>
    <div class="date-picker">
      <div class="date-picker-header">
        <span>切换日期</span>
        <button class="date-picker-close" id="datePickerClose" type="button">×</button>
      </div>
      <div class="date-picker-list" id="datePickerList">
        <!-- 由 JS 渲染日期项 -->
      </div>
    </div>
  </div>

  <!-- ===== 主内容区（六栏目视图） ===== -->
  <main class="app-main" id="appMain">

    <section class="page" data-page="highlights" id="page-highlights">
      <div class="page-header">
        <h2>📌 本日导读</h2>
        <p class="page-desc">高影响/置顶条目 · 点击卡片查看原文</p>
      </div>
      <div class="page-body" id="highlightsBody"></div>
    </section>

    <section class="page" data-page="alerts" id="page-alerts" hidden>
      <div class="page-header">
        <h2>⚠️ 预警提示</h2>
        <p class="page-desc">有明确截止日/生效日的倒计时条目 · 紧急（红） 重要（蓝） 关注（绿）</p>
      </div>
      <div class="page-body" id="alertsBody"></div>
    </section>

    <section class="page" data-page="policy" id="page-policy" hidden>
      <div class="page-header">
        <h2>📄 政策</h2>
        <p class="page-desc">政府发文/法规/规划/司法解释 · 按地区分组</p>
      </div>
      <div class="page-body" id="policyBody"></div>
    </section>

    <section class="page" data-page="industry" id="page-industry" hidden>
      <div class="page-header">
        <h2>🏭 行业</h2>
        <p class="page-desc">产业动态 · 市场信号 · 腾讯 &amp; 友商</p>
      </div>
      <div class="page-body" id="industryBody"></div>
    </section>

    <section class="page" data-page="personnel" id="page-personnel" hidden>
      <div class="page-header">
        <h2>👤 人事</h2>
        <p class="page-desc">副部级及以上任免公示</p>
      </div>
      <div class="page-body" id="personnelBody"></div>
    </section>

    <section class="page" data-page="events" id="page-events" hidden>
      <div class="page-header">
        <h2>📅 活动</h2>
        <p class="page-desc">会议/展会/发布会 · 关联度评级 ⭐⭐⭐ 高 / ⭐⭐ 中 / ⭐ 低</p>
      </div>
      <div class="page-body" id="eventsBody"></div>
    </section>

  </main>

  <!-- ===== 底部固定 Tab Bar（六栏目，对齐 liulawrance/policy-daily） ===== -->
  <nav class="tab-bar" id="tabBar" role="tablist">
    <button class="tab-item active" data-tab="highlights" role="tab">
      <span class="tab-icon">📌</span>
      <span class="tab-label">导读</span>
    </button>
    <button class="tab-item" data-tab="alerts" role="tab">
      <span class="tab-icon">⚠️</span>
      <span class="tab-label">预警</span>
    </button>
    <button class="tab-item" data-tab="policy" role="tab">
      <span class="tab-icon">📄</span>
      <span class="tab-label">政策</span>
    </button>
    <button class="tab-item" data-tab="industry" role="tab">
      <span class="tab-icon">🏭</span>
      <span class="tab-label">行业</span>
    </button>
    <button class="tab-item" data-tab="personnel" role="tab">
      <span class="tab-icon">👤</span>
      <span class="tab-label">人事</span>
    </button>
    <button class="tab-item" data-tab="events" role="tab">
      <span class="tab-icon">📅</span>
      <span class="tab-label">活动</span>
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
