<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>华东区域政策日报 · 数据校准中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a3a6c 0%, #0f2447 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 36px 28px;
      backdrop-filter: blur(8px);
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; line-height: 1.4; }
    p { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.85); margin-bottom: 12px; }
    .meta {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.1);
      font-size: 12px;
      color: rgba(255,255,255,.5);
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(255,193,7,.15);
      color: #ffc107;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <span class="badge">数据校准中</span>
    <h1>华东区域政策日报暂时下线</h1>
    <p>原页面所列政策、友商、腾讯动态的部分原文链接存在校验问题，为保证信息可追溯性与质量，已暂时关闭对外访问。</p>
    <p>团队正在重建数据采集流水线，校验每一条信息的原文链接 200 可达后再恢复发布。</p>
    <p>预计恢复时间：链接核验完成后第一时间上线。</p>
    <div class="meta">
      数据来源：华东公共事务部门 · 内部校准期间不对外提供数据<br>
      更新时间：2026-05-07
    </div>
  </div>
</body>
</html>
